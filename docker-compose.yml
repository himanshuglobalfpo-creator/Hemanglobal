services:
  ledgerlite:
    build: .
    container_name: ledgerlite
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      # Inside the compose network the DB host is the service name "postgres".
      # This overrides any localhost DATABASE_URL from .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledgerlite}:${POSTGRES_PASSWORD:-ledgerlite}@postgres:5432/${POSTGRES_DB:-ledgerlite}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: ledgerlite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgerlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerlite}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerlite}
    volumes:
      - ledgerlite_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerlite} -d ${POSTGRES_DB:-ledgerlite}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # S3-compatible object store for attachment blobs in local dev. The same
  # server/files.ts S3Driver (SigV4, no SDK) talks to MinIO here, AWS S3, or
  # Cloudflare R2 unchanged — only the S3_* env differs. Enable it by setting
  # FILE_STORAGE=s3 and the S3_* vars in .env (see .env.example). The one-shot
  # `minio-setup` service creates the bucket so uploads work on first boot.
  minio:
    image: minio/minio:latest
    container_name: ledgerlite-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET:-minioadmin}
    volumes:
      - ledgerlite_minio:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_KEY:-minioadmin} ${S3_SECRET:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-ledgerlite-attachments} &&
      echo 'MinIO bucket ready';
      "
    restart: "no"

volumes:
  ledgerlite_pgdata:
  ledgerlite_minio:
