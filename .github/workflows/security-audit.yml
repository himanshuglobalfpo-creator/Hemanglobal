name: Security Audit

# Weekly full dependency audit (all severities, prod + dev) as a report, plus
# the same high+ gate the PR pipeline enforces — so a newly-disclosed advisory
# in an existing dependency surfaces even without a code change.
on:
  schedule:
    - cron: "23 7 * * 1"   # 07:23 UTC every Monday
  workflow_dispatch: {}

jobs:
  audit:
    name: npm audit (full report + high gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full audit report (all severities) → artifact
        run: |
          npm audit --json > npm-audit-full.json || true
          echo "### npm audit summary" >> "$GITHUB_STEP_SUMMARY"
          npm audit || true
      - name: Upload full audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-full
          path: npm-audit-full.json
          retention-days: 30
      - name: Gate — fail on HIGH/CRITICAL in production deps
        run: npm audit --omit=dev --audit-level=high
